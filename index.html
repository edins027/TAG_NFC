<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAG NFC</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
font-family:'Inter',sans-serif;
background:#0f172a;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
color:white;
}
.card{
background:rgba(255,255,255,0.05);
padding:30px;
border-radius:20px;
width:90%;
max-width:400px;
text-align:center;
}
.btn{
width:100%;
padding:12px;
margin:6px 0;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
cursor:pointer;
}
</style>
</head>

<body>

<div class="card">
<img id="logo" style="width:80px;display:none;">
<h2 id="nome">Carregando...</h2>
<p id="endereco"></p>
<p id="extra"></p>
<div id="lista"></div>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbxYzAi_fxM_WdSespg0m4cYcw8f91BJy37R7fnBpqWagrUmg34-zjPebYblndTXTVk0hQ/exec";

const params = new URLSearchParams(window.location.search)
const usuario = params.get("usuario")
const obra = params.get("obra")
let senha = params.get("senha")

if(!senha){
  senha = prompt("Digite a senha:")
}

function abrir(url){
  window.open(url,"_blank")
}

fetch(`${API_URL}?usuario=${usuario}&senha=${senha}&obra=${obra}`)
.then(r=>r.json())
.then(data=>{

  if(data.length==0){
    document.getElementById("nome").innerText="Sem dados"
    return
  }

  const d = data[0]

  if(d.mostrar_logo=="S"){
    let logo = document.getElementById("logo")
    logo.src = d.logo
    logo.style.display="block"
  }

  if(d.mostrar_nome=="S"){
    document.getElementById("nome").innerText=d.nome_obra
  }

  if(d.mostrar_endereco=="S"){
    document.getElementById("endereco").innerText=d.endereco
  }

  if(d.mostrar_extra=="S"){
    document.getElementById("extra").innerText=d.descricao_extra
  }

  const lista = document.getElementById("lista")

  data.forEach(item=>{
    let btn = document.createElement("button")
    btn.className="btn"
    btn.innerText=item.nome_arquivo
    btn.onclick=()=>abrir(item.link)
    lista.appendChild(btn)
  })

})

</script>

</body>
</html>
