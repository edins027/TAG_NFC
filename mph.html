<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MpH Engenharia</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

<!-- Font Awesome (ícones) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Poppins',sans-serif;
background:url('mph.png') no-repeat center/cover;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.card{
background:rgba(15,23,42,0.88);
padding:35px;
border-radius:20px;
width:90%;
max-width:360px;
text-align:center;
backdrop-filter: blur(10px);
}

.logo{
width:90px;
border-radius:50%;
margin-bottom:15px;
}

h2{
margin-bottom:5px;
}

p{
color:#cbd5e1;
font-size:14px;
margin-bottom:25px;
}

.btn{
display:flex;
align-items:center;
gap:12px;
justify-content:center;
width:100%;
padding:14px;
margin:8px 0;
border:none;
border-radius:10px;
font-size:15px;
cursor:pointer;
font-weight:500;
color:white;
transition:.3s;
}

.btn i{
font-size:18px;
}

.btn:hover{
transform:scale(1.05);
}

.instagram{background:#E1306C;}
.whatsapp{background:#25D366;}
.linkedin{background:#0A66C2;}
.contato{background:#3b82f6;}
.pix{background:#10b981;}

</style>
</head>

<body>

<div class="card">

<img src="mph.png" class="logo">

<h2>MpH Construtora</h2>
<p>Gestão de sonhos</p>

<button class="btn instagram" onclick="abrirInstagram()">
<i class="fab fa-instagram"></i> Instagram
</button>

<button class="btn whatsapp" onclick="abrirWhatsapp()">
<i class="fab fa-whatsapp"></i> WhatsApp
</button>

<button class="btn linkedin" onclick="abrirLinkedin()">
<i class="fab fa-linkedin"></i> LinkedIn
</button>

<button class="btn contato" onclick="baixarContato()">
<i class="fas fa-address-card"></i> Salvar Contato
</button>

<button class="btn pix" onclick="copiarPix()">
<i class="fas fa-qrcode"></i> Chave Pix
</button>

</div>

<script>

const dados = {
nome: "MpH Construtora",
instagram: "seuusuario",
whatsapp: "5511999999999",
linkedin: "seu-linkedin",
pix: "mph@pix.com",
telefone: "551199999999",
email: "contato@mph.com.br"
}

function abrirInstagram(){
window.open(`https://instagram.com/${dados.instagram}`, '_blank')
}

function abrirWhatsapp(){
window.open(`https://wa.me/${dados.whatsapp}`, '_blank')
}

function abrirLinkedin(){
window.open(`https://linkedin.com/in/${dados.linkedin}`, '_blank')
}

function copiarPix(){
navigator.clipboard.writeText(dados.pix)
alert("Chave Pix copiada!")
}

function baixarContato(){

const vcard =
`BEGIN:VCARD
VERSION:3.0
FN:${dados.nome}
TEL:+${dados.telefone}
EMAIL:${dados.email}
END:VCARD`

const blob = new Blob([vcard], {type:"text/vcard"})
const link = document.createElement("a")

link.href = URL.createObjectURL(blob)
link.download = "contato.vcf"
link.click()
}

</script>

</body>
</html>
