<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MpH Engenharia</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Montserrat',sans-serif;
background:url('mph.png') no-repeat center/cover;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.container{
background:rgba(0,0,0,0.8);
padding:45px;
border-radius:15px;
width:90%;
max-width:420px;
}

h2{
font-weight:600;
margin-bottom:5px;
}

.subtitle{
font-size:14px;
color:#aaa;
margin-bottom:30px;
}

.link{
display:block;
text-decoration:none;
color:white;
padding:12px 0;
border-bottom:1px solid #333;
transition:.3s;
}

.link:hover{
color:#ef4444;
border-color:#ef4444;
}

</style>
</head>

<body>

<div class="container">

<h2>MpH Construtora</h2>
<div class="subtitle">Engenharia e Gestão de Projetos</div>

<a href="#" class="link" onclick="abrirInstagram()">Instagram</a>
<a href="#" class="link" onclick="abrirWhatsapp()">WhatsApp</a>
<a href="#" class="link" onclick="baixarContato()">Salvar Contato</a>
<a href="#" class="link" onclick="copiarPix()">Pagamento via Pix</a>

</div>

<script>

const dados = {
nome: "MpH Construtora",
instagram: "seuusuario",
whatsapp: "5511999999999",
pix: "mph@pix.com",
telefone: "551199999999",
email: "contato@mph.com.br"
}

function abrirInstagram(){
window.open(`https://instagram.com/${dados.instagram}`)
}

function abrirWhatsapp(){
window.open(`https://wa.me/${dados.whatsapp}`)
}

function copiarPix(){
navigator.clipboard.writeText(dados.pix)
alert("Pix copiado!")
}

function baixarContato(){

const vcard =
`BEGIN:VCARD
VERSION:3.0
FN:${dados.nome}
TEL:+${dados.telefone}
EMAIL:${dados.email}
END:VCARD`

const blob = new Blob([vcard], {type:"text/vcard"})
const link = document.createElement("a")

link.href = URL.createObjectURL(blob)
link.download = "contato.vcf"
link.click()
}

</script>

</body>
</html>
