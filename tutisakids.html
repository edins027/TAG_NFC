<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tuti & Isa</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<!-- Ícones -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Inter',sans-serif;
background:url('logoisa3.png') no-repeat center/cover;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
color:white;
}

/* efeito vidro Apple */
.card{
background:rgba(255,255,255,0.08);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
border-radius:28px;
padding:40px 30px;
width:90%;
max-width:360px;
text-align:center;
box-shadow: 0 10px 40px rgba(0,0,0,0.4);
animation:fadeIn 0.8s ease;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}

.logo{
width:75px;
border-radius:50%;
margin-bottom:15px;
}

h2{
font-weight:600;
font-size:20px;
letter-spacing:0.3px;
}

p{
font-size:14px;
color:rgba(255,255,255,0.7);
margin-bottom:30px;
max-width: 260px;
margin-left: auto;
margin-right: auto;
text-wrap: balance;
}

/* botões estilo Apple */
.btn{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
width:100%;
padding:14px;
margin:10px 0;
border-radius:14px;
border:none;
font-size:15px;
font-weight:400;
color:white;
cursor:pointer;

background:rgba(255,255,255,0.1);
backdrop-filter: blur(10px);

transition: all .25s ease;
}

.btn i{
font-size:16px;
opacity:0.8;
}

.btn:hover{
background:rgba(255,255,255,0.2);
transform:translateY(-2px);
}

/* cores sutis por tipo */
.instagram i{color:#ff7ab6;}
.whatsapp i{color:#25D366;}
.linkedin i{color:#0A66C2;}
.pix i{color:#10b981;}
.contato i{color:#60a5fa;}

.linkedin {
display: none;
}

  .pix {
display: none;
}
  
</style>
</head>

<body>

<div class="card">

<img src="logo_isa2.png" class="logo">

<h2>Tuti & Isa Kids</h2>
<p>Moda infantil</p>

<button class="btn instagram" onclick="abrirInstagram()">
<i class="fab fa-instagram"></i> Instagram
</button>

<button class="btn whatsapp" onclick="abrirWhatsapp()">
<i class="fab fa-whatsapp"></i> WhatsApp
</button>

<button class="btn linkedin" onclick="abrirLinkedin()">
<i class="fab fa-linkedin"></i> LinkedIn
</button>

<button class="btn contato" onclick="baixarContato()">
<i class="fas fa-address-card"></i> Salvar Contato
</button>

<button class="btn pix" onclick="copiarPix()">
<i class="fas fa-qrcode"></i> Chave Pix
</button>

</div>

<script>

const dados = {
nome: "Tuti & Isa Kids",
instagram: "tuti_isakids",
whatsapp: "5511985477947",
linkedin: "seu-linkedin",
pix: "informarchavepix",
telefone: "5511985477947",
email: "email"
}

function abrirInstagram(){
window.open(`https://instagram.com/${dados.instagram}`, '_blank')
}

function abrirWhatsapp(){
window.open(`https://wa.me/${dados.whatsapp}`, '_blank')
}

function abrirLinkedin(){
window.open(`https://linkedin.com/in/${dados.linkedin}`, '_blank')
}

function copiarPix(){
navigator.clipboard.writeText(dados.pix)
alert("Chave Pix copiada")
}

function baixarContato(){

const vcard =
`BEGIN:VCARD
VERSION:3.0
FN:${dados.nome}
TEL:+${dados.telefone}
EMAIL:${dados.email}
END:VCARD`

const blob = new Blob([vcard], {type:"text/vcard"})
const link = document.createElement("a")

link.href = URL.createObjectURL(blob)
link.download = "contato.vcf"
link.click()
}

</script>

</body>
</html>
