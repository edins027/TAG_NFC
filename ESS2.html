<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Simply Speaking</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<!-- Ícones -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
font-family:'Inter',sans-serif;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
color:white;
position:relative;
overflow-x:hidden;
/* fundo tema "vidro Apple": gradiente aurora escuro com manchas de cor desfocadas */
background:
  radial-gradient(circle at 15% 20%, rgba(255,122,182,0.35), transparent 45%),
  radial-gradient(circle at 85% 15%, rgba(96,165,250,0.35), transparent 45%),
  radial-gradient(circle at 50% 85%, rgba(37,211,102,0.25), transparent 50%),
  linear-gradient(160deg, #0b0c10 0%, #1c1e26 45%, #0b0c10 100%);
background-attachment: fixed;
}
/* manchas animadas extras para efeito "vivo" de vidro */
body::before, body::after{
content:"";
position:fixed;
width:60vmax;
height:60vmax;
border-radius:50%;
filter: blur(90px);
opacity:0.35;
z-index:0;
animation: float 18s ease-in-out infinite;
}
body::before{
background:#ff7ab6;
top:-20%;
left:-15%;
}
body::after{
background:#0A66C2;
bottom:-25%;
right:-15%;
animation-delay:6s;
}
@keyframes float{
0%,100%{ transform:translate(0,0) scale(1); }
50%{ transform:translate(30px,-20px) scale(1.08); }
}

/* seletor de idioma */
.lang-switcher{
position:fixed;
top:16px;
right:16px;
z-index:50;
}
.lang-btn{
display:flex;
align-items:center;
gap:6px;
background:rgba(255,255,255,0.12);
backdrop-filter: blur(14px);
-webkit-backdrop-filter: blur(14px);
border:1px solid rgba(255,255,255,0.2);
color:white;
padding:8px 12px;
border-radius:12px;
font-size:13px;
font-family:'Inter',sans-serif;
cursor:pointer;
transition: all .25s ease;
}
.lang-btn:hover{
background:rgba(255,255,255,0.22);
}
.lang-menu{
position:absolute;
top:calc(100% + 8px);
right:0;
background:rgba(30,30,30,0.85);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
border-radius:14px;
overflow:hidden;
min-width:150px;
box-shadow: 0 10px 30px rgba(0,0,0,0.4);
display:none;
flex-direction:column;
border:1px solid rgba(255,255,255,0.1);
}
.lang-menu.open{
display:flex;
}
.lang-option{
display:flex;
align-items:center;
gap:10px;
padding:10px 14px;
font-size:13px;
color:white;
cursor:pointer;
background:transparent;
border:none;
text-align:left;
font-family:'Inter',sans-serif;
transition: background .2s ease;
}
.lang-option:hover{
background:rgba(255,255,255,0.12);
}
.lang-option.active{
background:rgba(255,255,255,0.18);
font-weight:600;
}

/* efeito vidro Apple */
.card{
position:relative;
z-index:1;
background:rgba(255,255,255,0.08);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
border:1px solid rgba(255,255,255,0.15);
border-radius:28px;
padding:40px 30px;
width:90%;
max-width:360px;
text-align:center;
box-shadow: 0 10px 40px rgba(0,0,0,0.4);
animation:fadeIn 0.8s ease;
}
@keyframes fadeIn{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}
.logo{
width:75px;
height:75px;
object-fit:cover;
border-radius:50%;
margin-bottom:15px;
}
h2{
font-weight:600;
font-size:20px;
letter-spacing:0.3px;
}
p{
font-size:14px;
color:rgba(255,255,255,0.7);
margin-bottom:30px;
max-width: 260px;
margin-left: auto;
margin-right: auto;
text-wrap: balance;
}
/* botões estilo Apple */
.btn{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
width:100%;
padding:14px;
margin:10px 0;
border-radius:14px;
border:none;
font-size:15px;
font-weight:400;
color:white;
cursor:pointer;
background:rgba(255,255,255,0.1);
backdrop-filter: blur(10px);
transition: all .25s ease;
}
.btn i{
font-size:16px;
opacity:0.8;
}
.btn:hover{
background:rgba(255,255,255,0.2);
transform:translateY(-2px);
}
/* cores sutis por tipo */
.instagram i{color:#ff7ab6;}
.whatsapp i{color:#25D366;}
.linkedin i{color:#0A66C2;}
.facebook i{color:#1877F2;}
.site i{color:#f5c451;}
.pix i{color:#10b981;}
.contato i{color:#60a5fa;}
.pix {
display: none;
}

</style>
</head>
<body>

<!-- Seletor de idioma -->
<div class="lang-switcher">
  <button class="lang-btn" id="langToggle" onclick="toggleLangMenu()">
    <i class="fas fa-globe"></i> <span id="langLabel">ES</span> <i class="fas fa-chevron-down" style="font-size:10px;"></i>
  </button>
  <div class="lang-menu" id="langMenu">
    <button class="lang-option" data-lang="es" onclick="setLang('es')">🇪🇸 Español</button>
    <button class="lang-option" data-lang="en" onclick="setLang('en')">🇬🇧 English</button>
    <button class="lang-option" data-lang="pt" onclick="setLang('pt')">🇧🇷 Português</button>
  </div>
</div>

<div class="card">
<img src="539996082_122105081654993231_7795210673539375867_n.png" class="logo">
<h2>English Simply Speaking</h2>
<p id="subtitle">Hablar inglés fluido no es imposible.</p>
<button class="btn instagram" onclick="abrirInstagram()">
<i class="fab fa-instagram"></i> Instagram
</button>
<button class="btn whatsapp" onclick="abrirWhatsapp()">
<i class="fab fa-whatsapp"></i> WhatsApp
</button>
<button class="btn linkedin" onclick="abrirLinkedin()">
<i class="fab fa-linkedin"></i> LinkedIn
</button>
<button class="btn facebook" onclick="abrirFacebook()">
<i class="fab fa-facebook"></i> Facebook
</button>
<button class="btn site" onclick="abrirSite()">
<i class="fas fa-globe"></i> <span id="siteLabel">Sitio Web</span>
</button>
<button class="btn contato" id="btnContato" onclick="baixarContato()">
<i class="fas fa-address-card"></i> <span id="contatoLabel">Guardar Contacto</span>
</button>
</div>

<script>
const dados = {
  nome: "Patricia Georgette",
  instagram: "https://www.instagram.com/simplyspeaking4u/",
  whatsapp: "5491140638838",
  linkedin: "https://www.linkedin.com/company/englishsimplyspeaking/about/",
  facebook: "https://www.facebook.com/share/1D8AZ7ZfKR/",
  telefone: "+5491140638838",
  telefoneExibicao: "+54 911 4063-8838",
  email: "hello@englishsimplyspeaking.com",
  site: "https://englishsimplyspeaking.com/"
}

// Traduções
const traducoes = {
  es: {
    label: "ES",
    subtitle: "Hablar inglés fluido no es imposible.",
    contato: "Guardar Contacto",
    site: "Sitio Web",
    alertPix: "Clave Pix copiada"
  },
  en: {
    label: "EN",
    subtitle: "Speaking fluent English is not impossible.",
    contato: "Save Contact",
    site: "Website",
    alertPix: "Pix key copied"
  },
  pt: {
    label: "PT",
    subtitle: "Falar inglês fluente não é impossível.",
    contato: "Salvar Contato",
    site: "Site",
    alertPix: "Chave Pix copiada"
  }
}

function aplicarIdioma(lang){
  const t = traducoes[lang]
  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : (lang === 'en' ? 'en' : 'es')
  document.getElementById('subtitle').textContent = t.subtitle
  document.getElementById('contatoLabel').textContent = t.contato
  document.getElementById('siteLabel').textContent = t.site
  document.getElementById('langLabel').textContent = t.label

  document.querySelectorAll('.lang-option').forEach(el=>{
    el.classList.toggle('active', el.dataset.lang === lang)
  })

  localStorage.setItem('idioma', lang)
}

function setLang(lang){
  aplicarIdioma(lang)
  document.getElementById('langMenu').classList.remove('open')
}

function toggleLangMenu(){
  document.getElementById('langMenu').classList.toggle('open')
}

// fecha o menu ao clicar fora
document.addEventListener('click', function(e){
  const switcher = document.querySelector('.lang-switcher')
  if(!switcher.contains(e.target)){
    document.getElementById('langMenu').classList.remove('open')
  }
})

// idioma inicial: espanhol por padrão (ou o último escolhido pelo usuário)
const idiomaSalvo = localStorage.getItem('idioma')
aplicarIdioma(idiomaSalvo || 'es')

function abrirInstagram(){
  window.open(dados.instagram, '_blank')
}
function abrirWhatsapp(){
  window.open(`https://wa.me/${dados.whatsapp}`, '_blank')
}
function abrirLinkedin(){
  window.open(dados.linkedin, '_blank')
}
function abrirFacebook(){
  window.open(dados.facebook, '_blank')
}
function abrirSite(){
  window.open(dados.site, '_blank')
}
function copiarPix(){
  navigator.clipboard.writeText(dados.pix)
  const lang = localStorage.getItem('idioma') || 'es'
  alert(traducoes[lang].alertPix)
}
function baixarContato(){
  const vcard =
`BEGIN:VCARD
VERSION:3.0
FN:${dados.nome}
TEL;TYPE=CELL:${dados.telefone}
EMAIL:${dados.email}
URL:${dados.site}
END:VCARD`
  const blob = new Blob([vcard], {type:"text/vcard"})
  const link = document.createElement("a")
  link.href = URL.createObjectURL(blob)
  link.download = "contato.vcf"
  link.click()
}
</script>
</body>
</html>
