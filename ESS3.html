/* seletor de idioma */
.lang-switcher{
position:fixed;
top:16px;
right:16px;
z-index:50;
}
.lang-btn{
display:flex;
align-items:center;
gap:6px;
background:rgba(255,255,255,0.55);
backdrop-filter: blur(14px);
-webkit-backdrop-filter: blur(14px);
border:1px solid rgba(255,255,255,0.7);
color:#4a1a6b;
padding:8px 12px;
border-radius:12px;
font-size:13px;
font-weight:600;
font-family:'Inter',sans-serif;
cursor:pointer;
box-shadow: 0 4px 16px rgba(107,43,143,0.15);
transition: all .25s ease;
}
.lang-btn:hover{
background:rgba(255,255,255,0.75);
}
.lang-menu{
position:absolute;
top:calc(100% + 8px);
right:0;
background:rgba(255,255,255,0.85);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
border-radius:14px;
overflow:hidden;
min-width:150px;
box-shadow: 0 10px 30px rgba(107,43,143,0.25);
display:none;
flex-direction:column;
border:1px solid rgba(255,255,255,0.7);
}
.lang-menu.open{
display:flex;
}
.lang-option{
display:flex;
align-items:center;
gap:10px;
padding:10px 14px;
font-size:13px;
color:#4a1a6b;
cursor:pointer;
background:transparent;
border:none;
text-align:left;
font-family:'Inter',sans-serif;
transition: background .2s ease;
}
.lang-option:hover{
background:rgba(107,43,143,0.1);
}
.lang-option.active{
background:rgba(107,43,143,0.15);
font-weight:600;
}

/* efeito vidro Apple */
.card{
position:relative;
z-index:1;
background:rgba(255,255,255,0.55);
backdrop-filter: blur(24px);
-webkit-backdrop-filter: blur(24px);
border:1px solid rgba(255,255,255,0.75);
border-radius:28px;
padding:40px 30px;
width:90%;
max-width:360px;
text-align:center;
box-shadow: 0 20px 50px rgba(90,30,130,0.25);
animation:fadeIn 0.8s ease;
}
@keyframes fadeIn{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}
.logo{
width:78px;
height:78px;
object-fit:cover;
border-radius:22%;
margin-bottom:15px;
background:#ffffff;
padding:4px;
box-shadow: 0 8px 20px rgba(90,30,130,0.3), 0 0 0 1px rgba(255,255,255,0.8);
}
h2{
font-weight:600;
font-size:20px;
letter-spacing:0.3px;
color:#3a1656;
}
p{
font-size:14px;
color:rgba(58,22,86,0.7);
margin-bottom:30px;
max-width: 260px;
margin-left: auto;
margin-right: auto;
text-wrap: balance;
}
/* botões estilo Apple */
.btn{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
width:100%;
padding:14px;
margin:10px 0;
border-radius:14px;
border:1px solid rgba(255,255,255,0.6);
font-size:15px;
font-weight:500;
color:#3a1656;
cursor:pointer;
background:rgba(255,255,255,0.45);
backdrop-filter: blur(10px);
box-shadow: 0 4px 14px rgba(90,30,130,0.08);
transition: all .25s ease;
}
.btn i{
font-size:16px;
opacity:0.9;
}
.btn:hover{
background:rgba(255,255,255,0.75);
transform:translateY(-2px);
box-shadow: 0 8px 20px rgba(90,30,130,0.18);
}
/* cores sutis por tipo, alinhadas à paleta roxo/rosa da marca */
.instagram i{color:#d6336c;}
.whatsapp i{color:#25D366;}
.linkedin i{color:#0A66C2;}
.facebook i{color:#1877F2;}
.site i{color:#8b3ac9;}
.pix i{color:#10b981;}
.contato i{color:#6b2b8f;}
.pix {
display: none;
}

</style>
</head>
<body>

<!-- Seletor de idioma -->
<div class="lang-switcher">
  <button class="lang-btn" id="langToggle" onclick="toggleLangMenu()">
    <i class="fas fa-globe"></i> <span id="langLabel">ES</span> <i class="fas fa-chevron-down" style="font-size:10px;"></i>
  </button>
  <div class="lang-menu" id="langMenu">
    <button class="lang-option" data-lang="es" onclick="setLang('es')">🇪🇸 Español</button>
    <button class="lang-option" data-lang="en" onclick="setLang('en')">🇬🇧 English</button>
    <button class="lang-option" data-lang="pt" onclick="setLang('pt')">🇧🇷 Português</button>
  </div>
</div>

<div class="card">
<img src="539996082_122105081654993231_7795210673539375867_n.png" class="logo">
<h2>English Simply Speaking</h2>
<p id="subtitle">Hablar inglés fluido no es imposible.</p>
<button class="btn instagram" onclick="abrirInstagram()">
<i class="fab fa-instagram"></i> Instagram
</button>
<button class="btn whatsapp" onclick="abrirWhatsapp()">
<i class="fab fa-whatsapp"></i> WhatsApp
</button>
<button class="btn linkedin" onclick="abrirLinkedin()">
<i class="fab fa-linkedin"></i> LinkedIn
</button>
<button class="btn facebook" onclick="abrirFacebook()">
<i class="fab fa-facebook"></i> Facebook
</button>
<button class="btn site" onclick="abrirSite()">
<i class="fas fa-globe"></i> <span id="siteLabel">Sitio Web</span>
</button>
<button class="btn contato" id="btnContato" onclick="baixarContato()">
<i class="fas fa-address-card"></i> <span id="contatoLabel">Guardar Contacto</span>
</button>
</div>

<script>
const dados = {
  nome: "Patricia Georgette",
  instagram: "https://www.instagram.com/simplyspeaking4u/",
  whatsapp: "5491165741198",
  linkedin: "https://www.linkedin.com/company/englishsimplyspeaking/about/",
  facebook: "https://www.facebook.com/share/1D8AZ7ZfKR/",
  telefone: "+5491165741198",
  telefoneExibicao: "+54 911 6574-1198",
  email: "hello@englishsimplyspeaking.com",
  site: "https://englishsimplyspeaking.com/"
}

  
// Traduções
const traducoes = {
  es: {
    label: "ES",
    subtitle: "Hablar inglés fluido no es imposible.",
    contato: "Guardar Contacto",
    site: "Sitio Web",
    alertPix: "Clave Pix copiada"
  },
  en: {
    label: "EN",
    subtitle: "Speaking fluent English is not impossible.",
    contato: "Save Contact",
    site: "Website",
    alertPix: "Pix key copied"
  },
  pt: {
    label: "PT",
    subtitle: "Falar inglês fluente não é impossível.",
    contato: "Salvar Contato",
    site: "Site",
    alertPix: "Chave Pix copiada"
  }
}

function aplicarIdioma(lang){
  const t = traducoes[lang]
  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : (lang === 'en' ? 'en' : 'es')
  document.getElementById('subtitle').textContent = t.subtitle
  document.getElementById('contatoLabel').textContent = t.contato
  document.getElementById('siteLabel').textContent = t.site
  document.getElementById('langLabel').textContent = t.label

  document.querySelectorAll('.lang-option').forEach(el=>{
    el.classList.toggle('active', el.dataset.lang === lang)
  })

  localStorage.setItem('idioma', lang)
}

function setLang(lang){
  aplicarIdioma(lang)
  document.getElementById('langMenu').classList.remove('open')
}

function toggleLangMenu(){
  document.getElementById('langMenu').classList.toggle('open')
}

// fecha o menu ao clicar fora
document.addEventListener('click', function(e){
  const switcher = document.querySelector('.lang-switcher')
  if(!switcher.contains(e.target)){
    document.getElementById('langMenu').classList.remove('open')
  }
})

// idioma inicial: espanhol por padrão (ou o último escolhido pelo usuário)
const idiomaSalvo = localStorage.getItem('idioma')
aplicarIdioma(idiomaSalvo || 'es')

function abrirInstagram(){
  window.open(dados.instagram, '_blank')
}
function abrirWhatsapp(){
  window.open(`https://wa.me/${dados.whatsapp}`, '_blank')
}
function abrirLinkedin(){
  window.open(dados.linkedin, '_blank')
}
function abrirFacebook(){
  window.open(dados.facebook, '_blank')
}
function abrirSite(){
  window.open(dados.site, '_blank')
}
function copiarPix(){
  navigator.clipboard.writeText(dados.pix)
  const lang = localStorage.getItem('idioma') || 'es'
  alert(traducoes[lang].alertPix)
}
function baixarContato(){
  const vcard =
`BEGIN:VCARD
VERSION:3.0
FN:${dados.nome}
TEL;TYPE=CELL:${dados.telefone}
EMAIL:${dados.email}
URL:${dados.site}
END:VCARD`
  const blob = new Blob([vcard], {type:"text/vcard"})
  const link = document.createElement("a")
  link.href = URL.createObjectURL(blob)
  link.download = "contato.vcf"
  link.click()
}
</script>
</body>
</html>
